<!doctype html>
<html><head><meta charset="utf-8"><title>Ruffle reference harness</title>
<style>html,body{margin:0;background:#000;height:100%}#stage{width:100vw;height:100vh}</style>
</head><body><div id="stage"></div>
<script>
  // Serves the original SWFs through Ruffle for reference captures (dev-only, never shipped).
  // Usage: /tools/ruffle/harness.html?swf=/reference/Junior_Game/movies/e-Bug%20Junior%20Game.swf&base=/reference/Junior_Game/movies/&vars=language=en_en
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = { autoplay: 'on', unmuteOverlay: 'hidden', splashScreen: false, letterbox: 'on', logLevel: new URLSearchParams(location.search).get('log') || 'warn', allowScriptAccess: true, publicPath: '/node_modules/@ruffle-rs/ruffle/' };
</script>
<script src="/node_modules/@ruffle-rs/ruffle/ruffle.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const player = window.RufflePlayer.newest().createPlayer();
  player.style.width = '100%'; player.style.height = '100%';
  document.getElementById('stage').appendChild(player);
  window.__ruffle = player;
  const start = () => { const api = typeof player.ruffle === 'function' ? player.ruffle() : player;
  return api.load({ url: q.get('swf'), base: q.get('base') || undefined, parameters: q.get('vars') || '' })
; };
  (function tryStart(n) {
    const api = typeof player.ruffle === 'function' ? player.ruffle() : player;
    if (typeof api.load !== 'function') { if (n > 100) { window.__loadError = 'ruffle api never ready'; return; } return setTimeout(() => tryStart(n + 1), 50); }
    start().then(() => { window.__loaded = true; }).catch(e => { window.__loadError = String(e); });
  })(0);
</script>
</body></html>
